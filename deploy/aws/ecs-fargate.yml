AWSTemplateFormatVersion: "2010-09-09"
Description: IntentGuard gateway on ECS Fargate with external RDS, ElastiCache, and OIDC.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, preferably pinned by digest.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
    Description: ACM certificate for the public HTTPS listener.
  DatabaseUrlSecretArn:
    Type: String
    Description: Secrets Manager secret containing the PostgreSQL URL.
  RedisUrlSecretArn:
    Type: String
    Description: Secrets Manager secret containing the Redis URL.
  LeasePrivateKeySecretArn:
    Type: String
    Description: Secrets Manager secret containing the encoded Ed25519 private key.
  JwtIssuer:
    Type: String
  JwksUrl:
    Type: String
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
  AllowedCorsOrigins:
    Type: String
    Default: https://example.invalid

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: intentguard
      ClusterSettings: [{Name: containerInsights, Value: enabled}]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/intentguard-gateway
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadIntentGuardRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref RedisUrlSecretArn
                  - !Ref LeasePrivateKeySecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS access to IntentGuard
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IntentGuard tasks accept traffic only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: intentguard-gateway
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: temporary-files
      ContainerDefinitions:
        - Name: gateway
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints:
            - SourceVolume: temporary-files
              ContainerPath: /tmp
              ReadOnly: false
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
              Name: http
          Command: ["uvicorn", "intentguard.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers"]
          Environment:
            - {Name: INTENTGUARD_JWT_ISSUER, Value: !Ref JwtIssuer}
            - {Name: INTENTGUARD_JWT_AUDIENCE, Value: intentguard-api}
            - {Name: INTENTGUARD_JWKS_URL, Value: !Ref JwksUrl}
            - {Name: INTENTGUARD_CORS_ORIGINS, Value: !Ref AllowedCorsOrigins}
            - {Name: INTENTGUARD_OPA_EXECUTABLE, Value: /usr/local/bin/opa}
            - {Name: INTENTGUARD_LOG_LEVEL, Value: INFO}
            - {Name: INTENTGUARD_LOG_FORMAT, Value: json}
          Secrets:
            - {Name: INTENTGUARD_DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecretArn}
            - {Name: INTENTGUARD_REDIS_URL, ValueFrom: !Ref RedisUrlSecretArn}
            - {Name: INTENTGUARD_LEASE_PRIVATE_KEY, ValueFrom: !Ref LeasePrivateKeySecretArn}
          HealthCheck:
            Command: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)\""]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 30
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref PrivateSubnetIds

Outputs:
  GatewayUrl:
    Value: !Sub https://${LoadBalancer.DNSName}
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskSecurityGroupId:
    Description: Allow this security group to reach RDS and ElastiCache.
    Value: !Ref TaskSecurityGroup
