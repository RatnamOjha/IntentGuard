[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard"
version = "0.1.0"
description = "Runtime governance for financial AI agents"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
dev = [
    "httpx>=0.27,<1",
]

[project.scripts]
intentguard-api = "intentguard.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
