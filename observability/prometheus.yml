global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: intentguard-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8000]

  - job_name: intentguard-booking-connector
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8100]
