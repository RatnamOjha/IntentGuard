name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Every step below exits non-zero on failure and none set `continue-on-error`,
# so a failing test fails the build.
jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is the dev version.
        python-version: ["3.10", "3.12"]
    # The budget ledger's correctness claim is about concurrent replicas, so it
    # has to be tested against a real Postgres, not a stub.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intentguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      INTENTGUARD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intentguard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,postgres]"

      - name: Apply migrations
        run: psql "$INTENTGUARD_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_budget_ledger.sql

      - name: Run the Python test suite
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend (operator console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: .wrangler/wrangler.log
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: prototype/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors the frontend half of scripts/test-all.sh.
      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Build and run the render test
        run: pnpm test
